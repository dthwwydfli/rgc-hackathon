<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moments — daypart matrix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f7f5;
      --card: #fff;
      --ink: #1d1d1d;
      --muted: #5b5b5b;
      --line: rgba(29, 29, 29, 0.1);
      --lime: #b8f000;
      --green: #22a651;
      --teal: #53cdc5;
      --indigo: #6a6ae2;
      --purple: #9c6dba;
      --font-display: Helvetica, "Helvetica Neue", Arial, sans-serif;
      --font-ui: Inter, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-ui);
      color: var(--ink);
      background: var(--bg);
    }
    header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.25rem 1.5rem;
      background: var(--card);
      border-bottom: 1px solid var(--line);
    }
    .brand {
      font-family: var(--font-display);
      font-size: 1.5rem;
      letter-spacing: -0.05em;
      font-weight: 500;
    }
    .hint { color: var(--muted); font-size: 0.9rem; }
    .week {
      margin-left: auto;
      display: flex;
      gap: 0.35rem;
    }
    .week button {
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      font: inherit;
      font-size: 0.75rem;
      cursor: pointer;
      color: var(--muted);
    }
    .week button.is-today {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
      font-weight: 600;
    }

    main { padding: 1.5rem; max-width: 72rem; margin: 0 auto; }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .swatch {
      display: inline-block;
      width: 0.85rem;
      height: 0.85rem;
      border-radius: 2px;
      margin-right: 0.35rem;
      vertical-align: -2px;
    }

    .board {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 4px;
      overflow: auto;
    }
    table {
      border-collapse: separate;
      border-spacing: 0;
      width: 100%;
      min-width: 52rem;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
      padding: 0;
      vertical-align: middle;
    }
    th:last-child, td:last-child { border-right: 0; }
    tr:last-child td { border-bottom: 0; }

    .corner {
      position: sticky;
      left: 0;
      z-index: 3;
      background: var(--card);
      min-width: 11rem;
      padding: 0.85rem 1rem;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      text-align: left;
    }
    .moment-head {
      background: #fafafa;
      padding: 0.75rem 0.65rem;
      text-align: center;
      min-width: 7.5rem;
    }
    .moment-head strong {
      display: block;
      font-family: var(--font-display);
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: -0.02em;
    }
    .moment-head span {
      display: block;
      margin-top: 0.2rem;
      font-size: 0.7rem;
      color: var(--muted);
    }
    .product {
      position: sticky;
      left: 0;
      z-index: 2;
      background: var(--card);
      padding: 0.65rem 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      white-space: nowrap;
    }
    .cell {
      height: 3.25rem;
      text-align: center;
    }
    .cell button {
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
      cursor: pointer;
      font: inherit;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--ink);
    }
    .cell button:hover { filter: brightness(0.97); }
    .win-solid { background: rgba(184, 240, 0, 0.55); }
    .win-dir { background: rgba(83, 205, 197, 0.4); }
    .win-pred { background: rgba(106, 106, 226, 0.22); }
    .miss { background: transparent; color: transparent; }
    .miss button { cursor: default; color: #ccc; font-weight: 400; }

    .panel[hidden] { display: none; }
    .panel { position: fixed; inset: 0; z-index: 20; }
    .backdrop {
      position: absolute; inset: 0; border: 0; width: 100%;
      background: rgba(0,0,0,0.28); cursor: pointer;
    }
    .dialog {
      position: absolute; top: 0; right: 0; bottom: 0;
      width: min(22rem, 100%);
      background: #fff;
      padding: 1.25rem 1.5rem;
      box-shadow: -8px 0 28px rgba(0,0,0,0.12);
    }
    .dialog h2 {
      margin: 0 0 0.35rem;
      font-family: var(--font-display);
      font-size: 1.2rem;
      letter-spacing: -0.04em;
      font-weight: 500;
    }
    .label {
      margin: 1rem 0 0.25rem;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .close {
      float: right; border: 0; background: 0; font-size: 1.25rem; cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">Moments</div>
    <p class="hint">Product × shopper moment — where each SKU wins</p>
    <div class="week" aria-label="Week" data-week></div>
  </header>

  <main>
    <div class="legend">
      <span><i class="swatch win-solid"></i>Solid win</span>
      <span><i class="swatch win-dir"></i>Directional</span>
      <span><i class="swatch win-pred"></i>Predicted</span>
      <span>Empty = not the best slot for that product</span>
    </div>
    <div class="board">
      <table>
        <thead>
          <tr data-head>
            <th class="corner">Product \\ Moment</th>
          </tr>
        </thead>
        <tbody data-body></tbody>
      </table>
    </div>
  </main>

  <div class="panel" id="panel" hidden>
    <button class="backdrop" type="button" data-close aria-label="Close"></button>
    <div class="dialog" role="dialog" aria-modal="true">
      <button class="close" type="button" data-close aria-label="Close">×</button>
      <h2 data-title></h2>
      <p data-rank style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted)"></p>
      <p class="label">What should the brand do next</p>
      <p data-next></p>
      <p class="label">Cost · Owner · How hard</p>
      <p data-facts></p>
    </div>
  </div>

  <script>
    const MOMENTS = [
      { id: "morning_rush", name: "Morning rush", time: "07:30–09:00" },
      { id: "mid_morning", name: "Mid-morning", time: "09:30–11:00" },
      { id: "quick_lunch", name: "Quick lunch", time: "12:00–14:00" },
      { id: "afternoon_lull", name: "Afternoon lull", time: "14:30–16:00" },
      { id: "commute_home", name: "Commute home", time: "16:30–17:45" },
      { id: "post_workout", name: "Post-workout", time: "18:00–20:00" },
      { id: "evening_treat", name: "Evening treat", time: "20:00–21:00" },
    ];

    const PRODUCTS = [
      { id: "banana", name: "Bananas", win: "morning_rush", rank: "solid", next: "Keep entrance chiller face-out at open", cost: "£5", owner: "brand", effort: "Low" },
      { id: "croissant", name: "Croissants", win: "morning_rush", rank: "dir", next: "Till bake-off callout before 9", cost: "£5", owner: "retailer", effort: "Low" },
      { id: "oat_bar", name: "Nature Valley Oats & Honey", win: "mid_morning", rank: "dir", next: "Snack-aisle eye-level clip strip", cost: "£5", owner: "retailer", effort: "Low" },
      { id: "cold_brew", name: "Starbucks Cold Brew", win: "mid_morning", rank: "pred", next: "Chiller door strip for 10am dip", cost: "£5", owner: "brand", effort: "Medium" },
      { id: "greek_yogurt", name: "Fage Total 0%", win: "quick_lunch", rank: "solid", next: "Protein claim larger on lid", cost: "£5", owner: "brand", effort: "Low" },
      { id: "hummus_pot", name: "Sabra Classic Hummus", win: "quick_lunch", rank: "dir", next: "Bundle with crackers at till", cost: "£5", owner: "retailer", effort: "Medium" },
      { id: "apple", name: "Royal Gala Apples", win: "afternoon_lull", rank: "solid", next: "Loose fruit bowl near coffee", cost: "£5", owner: "retailer", effort: "Low" },
      { id: "rice_cakes", name: "Kallo Rice Cakes", win: "afternoon_lull", rank: "pred", next: "Soft health claim on endcap", cost: "£5", owner: "brand", effort: "Low" },
      { id: "energy_gel", name: "SiS GO Isotonic Gel", win: "commute_home", rank: "dir", next: "Hang near gym aisle exit", cost: "£5", owner: "retailer", effort: "Low" },
      { id: "trail_mix", name: "Mixed Nuts & Raisins", win: "commute_home", rank: "pred", next: "Grab-bag near gates", cost: "£5", owner: "brand", effort: "Medium" },
      { id: "protein_bar", name: "Grenade Protein Bar", win: "post_workout", rank: "solid", next: "Protein bay endcap 6–8pm", cost: "£5", owner: "retailer", effort: "Low" },
      { id: "challenger", name: "Nakd Cocoa Hazelnut", win: "post_workout", rank: "solid", next: "Natural claim next to Grenade", cost: "£5", owner: "brand", effort: "Medium" },
      { id: "protein_shake", name: "Puffy Protein Shake", win: "post_workout", rank: "dir", next: "Chiller door facing gym exit", cost: "£5", owner: "retailer", effort: "Low" },
      { id: "dark_chocolate", name: "Lindt Excellence 85%", win: "evening_treat", rank: "pred", next: "Till tray after 8pm", cost: "£5", owner: "retailer", effort: "Low" },
    ];

    const RANK_CLASS = { solid: "win-solid", dir: "win-dir", pred: "win-pred" };
    const RANK_LABEL = { solid: "Solid win", dir: "Directional win", pred: "Predicted win" };

    const head = document.querySelector("[data-head]");
    const body = document.querySelector("[data-body]");
    const week = document.querySelector("[data-week]");
    const panel = document.getElementById("panel");

    const days = ["M","T","W","T","F","S","S"];
    const todayIdx = (new Date().getDay() + 6) % 7;
    days.forEach((d, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = d;
      if (i === todayIdx) b.className = "is-today";
      week.append(b);
    });

    MOMENTS.forEach((m) => {
      const th = document.createElement("th");
      th.className = "moment-head";
      th.innerHTML = "<strong>" + m.name + "</strong><span>" + m.time + "</span>";
      head.append(th);
    });

    function openPanel(product, moment) {
      panel.querySelector("[data-title]").textContent = product.name + " · " + moment.name;
      panel.querySelector("[data-rank]").textContent = RANK_LABEL[product.rank];
      panel.querySelector("[data-next]").textContent = product.next;
      panel.querySelector("[data-facts]").textContent =
        product.cost + " · " + product.owner + " · " + product.effort;
      panel.hidden = false;
    }
    panel.querySelectorAll("[data-close]").forEach((el) => {
      el.addEventListener("click", () => { panel.hidden = true; });
    });

    PRODUCTS.forEach((product) => {
      const tr = document.createElement("tr");
      const name = document.createElement("th");
      name.className = "product";
      name.scope = "row";
      name.textContent = product.name;
      tr.append(name);

      MOMENTS.forEach((moment) => {
        const td = document.createElement("td");
        td.className = "cell";
        const btn = document.createElement("button");
        btn.type = "button";
        if (product.win === moment.id) {
          td.classList.add(RANK_CLASS[product.rank]);
          btn.textContent = RANK_LABEL[product.rank].split(" ")[0];
          btn.addEventListener("click", () => openPanel(product, moment));
        } else {
          td.classList.add("miss");
          btn.textContent = "·";
          btn.disabled = true;
        }
        td.append(btn);
        tr.append(td);
      });
      body.append(tr);
    });
  </script>
</body>
</html>
